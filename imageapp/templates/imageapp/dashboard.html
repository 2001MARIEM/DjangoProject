<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Image</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            /* Couleur claire neutre */
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #333;
        }

        /* HEADER */
        .dashboard-header {
            background: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e4e6eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .dashboard-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #333;
        }

        .logout-btn {
            background: #4c6ef5;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            color: #fff;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: #3b5bdb;
        }

        /* CARD */
        .image-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        .card-body {
            padding: 25px;
            text-align: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #222;
        }

        .card-text {
            color: #6c757d;
        }

        .card-img-bottom {
            width: 100%;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="dashboard-header">
        <h4 class="dashboard-title">Dashboard - Dernière Image</h4>

        <a href="{% url 'logout' %}" class="btn logout-btn">
            Déconnexion
        </a>
    </div>

    <!-- Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="image-card card">

                    <div class="card-body">
                        <h5 class="card-title">Dernière Image Reçue</h5>
                        <p class="card-text">Voici l'image la plus récente envoyée par le système embarqué.</p>
                    </div>

                    <img src="{% url 'serve_image' image_id %}" class="card-img-bottom" alt="{{ image_filename }}">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
